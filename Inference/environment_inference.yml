name: inference
channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python & build tools
  - python=3.12
  - pip

  # Scientific & HDF5 / NetCDF I/O stack
  - numpy>=2.0,<2.3
  - scipy
  - pandas>=2.2,<3.0
  - h5py
  - pytables
  - blosc
  - c-blosc2
  - xarray
  - h5netcdf
  - numba

  # Graph, ML preprocessing & plotting
  - networkx
  - scikit-learn
  - matplotlib
  - seaborn

  # Utilities & Excel/XML/YAML support
  - openpyxl
  - lxml
  - pyyaml
  - psutil
  - requests
  - pytz
  - tqdm
  - ipykernel

  # Domain-specific packages (demand allocation, powerflow, VMD, Transformer inference)
  - pip:
      - pvlib==0.12.0
      - opendhw==0.2.5
      - richardsonpy==0.2.1
      - teaser==0.7.7
      - holidays==0.73
      - pylightxl==1.61
      - xlrd==2.0.1
      - pandapower==3.4.0
      - deepdiff
      - geojson
      - vmdpy
      - torch
