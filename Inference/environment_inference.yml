name: inference
channels:
  - conda-forge
  - nodefaults

dependencies:
  # Core Python & native HDF5 / Blosc compression libraries
  - python=3.12
  - pip
  - hdf5
  - blosc
  - c-blosc2
  - pytables
  - h5py

  # Python packages for demand allocation, MV disconnection, pre-expansion powerflow,
  # feature extraction, and VMD preprocessing (PyTorch runs separately on GPU nodes)
  - pip:
      - numpy>=2.0,<2.3
      - scipy
      - pandas>=2.2,<3.0
      - numba
      - xarray
      - h5netcdf
      - networkx
      - scikit-learn
      - matplotlib
      - seaborn
      - openpyxl
      - lxml
      - pyyaml==6.0.2
      - psutil
      - requests
      - pytz
      - tqdm
      - ipykernel
      - pvlib==0.12.0
      - opendhw==0.2.5
      - richardsonpy==0.2.1
      - teaser==0.7.7
      - holidays==0.73
      - pylightxl==1.61
      - xlrd==2.0.1
      - pandapower==3.4.0
      - deepdiff
      - geojson
      - vmdpy
